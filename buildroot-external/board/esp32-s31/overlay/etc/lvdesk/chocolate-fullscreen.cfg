fullscreen                    1
fullscreen_width              320
fullscreen_height             240
window_width                  320
window_height                 240
aspect_ratio_correct          1
smooth_pixel_scaling          0
integer_scaling               0
force_software_renderer       1
use_libsamplerate             0

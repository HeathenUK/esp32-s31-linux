  GL demos
    # Stock mesa-demos 9.0.0, freeglut and SDL's testgl through our libGL
    # (docs/gl-plan-2026-09-25.md), kept like the other apps: binaries in
    # /root/gl2/bin, GLU and freeglut in /root/gl2/lib, data where the demos
    # were built to look (/usr/share/mesa-demos). Arrow keys; Esc quits.
    # None has sound. glxgears: -geometry WxH for a window (default 300x300);
    # -fullscreen is always the panel size (it ignores -geometry). The GLUT
    # demos all call glutInitWindowSize BEFORE glutInit, so freeglut's own
    # -geometry wins; GLUT has no fullscreen switch. manywin needs a window
    # count (no argument only prints its usage); lvdesk shows 4 X windows.
    # testgl: fixed 640x480, -fullscreen its only mode switch.

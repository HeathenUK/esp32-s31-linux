# lvdesk application menu - right-click the desktop.
# Two spaces per level. "label = command" runs the command in the terminal;
# a line without "=" is a submenu. Commands run in a login shell of their own
# (profile environment, no terminal); output goes to /tmp/lvdesk-apps.log.
# "@name cmd" runs cmd only if no process called name is already running,
# and raises its window instead. "!terminal" raises the built-in terminal.
Games
  Doom
    Fullscreen 320x240 = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 240 -fullscreen
    Fullscreen 320x200 = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 200 -fullscreen
    Window 320x240 = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 240 -window
    Window 320x200 = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 200 -window
    Timedemo 320x200 fullscreen = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 200 -fullscreen -timedemo demo1
    Chocolate Doom (SDL2) window (no sound) = @chocolate-doom cd /root/doom && ./chocolate-doom -window -width 320 -height 200 -1 -nosound -nomusic
    Chocolate Doom fullscreen 320x240 (sound) = @chocolate-doom cd /root/doom && ./chocolate-doom -fullscreen -extraconfig /etc/lvdesk/chocolate-fullscreen.cfg
  OpenTyrian
    Play (sound) = @opentyrian cd /root/oty/usr/share/opentyrian/data && HOME=/root /root/oty/usr/bin/opentyrian --no-joystick
    Play (no sound) = @opentyrian cd /root/oty/usr/share/opentyrian/data && HOME=/root /root/oty/usr/bin/opentyrian --no-sound --no-joystick
  Quake
    # TyrQuake 0.62 takes argv[1] as $HOME/<gamedir>, so "id1" + HOME=/root/quake
    # makes saves/config land in /root/quake/id1 (not a junk /root/-basedir).
    # Audio rate A/B (2026-09-23): TyrQuake asks for 48 kHz and mixes at whatever
    # it is granted; the 11 kHz device was never verified by ear and sounded
    # wrong in a timedemo, so all three rates are offered here. Only AUDIODEV
    # differs; the binary and its arguments are identical.
    Fullscreen 320x240 (11 kHz audio) = @tiopex-quake cd /root/quake && HOME=/root/quake AUDIODEV=s31route_11k ./tiopex-quake id1 -basedir /root/quake -mem 10 -width 320 -height 240 -fullscreen
    Fullscreen 320x240 (22 kHz audio) = @tiopex-quake cd /root/quake && HOME=/root/quake AUDIODEV=s31route_22k ./tiopex-quake id1 -basedir /root/quake -mem 10 -width 320 -height 240 -fullscreen
    Fullscreen 320x240 (48 kHz audio) = @tiopex-quake cd /root/quake && HOME=/root/quake AUDIODEV=default ./tiopex-quake id1 -basedir /root/quake -mem 10 -width 320 -height 240 -fullscreen
    Window 320x240 = @tiopex-quake cd /root/quake && HOME=/root/quake AUDIODEV=s31route_11k ./tiopex-quake id1 -basedir /root/quake -mem 10 -width 320 -height 240 -window
    Timedemo demo1 = @tiopex-quake cd /root/quake && HOME=/root/quake AUDIODEV=s31route_11k ./tiopex-quake id1 -basedir /root/quake -mem 10 -width 320 -height 240 -window +timedemo demo1
Apps
  Files = @xfiles xfiles /root
  Calculator = @xcalc xcalc
  Clock = @xclock xclock
  Terminal (st) = st
System
  Terminal = !terminal

# lvdesk application menu - right-click the desktop.
# Two spaces per level. "label = command" runs the command in the terminal;
# a line without "=" is a submenu. Commands run in a login shell of their own
# (profile environment, no terminal); output goes to /tmp/lvdesk-apps.log.
# "@name cmd" runs cmd only if no process called name is already running,
# and raises its window instead. "!console" drops the built-in terminal down
# as the Super+` console ("!terminal" still opens it as a window, but st is
# the menu's terminal now).
#
# LIMITS (lvdesk.c appmenu_load): MENU_MAX 512 non-comment lines (submenus
# count), labels 39 chars (about 33 show), commands 199 chars, lines under
# 300 chars. lvdesk logs "lvdesk: menu: ..." for anything past a limit.
#
# Launch variants (owner request 2026-09-27): each app's OWN switches only -
# every size x fullscreen/window x sound rate where the app takes one. Per
# app: its tuned, known-good line first, then Fullscreen > size > rate and
# Window > size > rate (tuned rate first in each), then extras. "(heavy)" =
# 640x480/800x480 native rendering or a rate that grows the sound cache: it
# may page or not fit in 15.4 MB. Generated by artifacts/menu/genmenu.py;
# the switch reference and what has NO switch: artifacts/menu/VARIANTS.md.

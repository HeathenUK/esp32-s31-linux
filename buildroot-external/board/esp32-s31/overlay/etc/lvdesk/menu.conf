# lvdesk application menu - right-click the desktop.
# Two spaces per level. "label = command" runs the command in the terminal;
# a line without "=" is a submenu. Commands run in a login shell of their own
# (profile environment, no terminal); output goes to /tmp/lvdesk-apps.log.
# "@name cmd" runs cmd only if no process called name is already running,
# and raises its window instead. "!console" drops the built-in terminal down
# as the Super+` console ("!terminal" still opens it as a window, but st is
# the menu's terminal now).
#
# LIMITS (lvdesk.c appmenu_load): at most 96 non-comment lines (submenus
# count), labels 39 chars (about 33 show), commands 199 chars, any line
# under 300 chars. Past 96 lines the rest is DROPPED SILENTLY - count with
# grep -vc before adding. This file is at 95.
#
# Launch variants (owner request 2026-09-27): each app's OWN switches only -
# resolution, fullscreen/window and, where the app itself takes one, the
# sound rate. "(heavy)" = 640x480/800x480 native rendering or a rate that
# grows the sound cache: may page or not fit in 15.4 MB. The first row of
# each app is its tuned, known-good line. Switch reference and what has no
# switch: artifacts/menu/VARIANTS.md.
Games
  Doom
    # prboom 2.5.0: -width/-height, -fullscreen/-window. No rate switch
    # (snd_samplerate is config-only, and 2.5.0 ignored it - current-state).
    prboom
      320x240 full = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 240 -fullscreen
      320x200 full = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 200 -fullscreen
      640x480 full (heavy) = @prboom cd /root/doom/wads && /root/doom/prboom -width 640 -height 480 -fullscreen
      800x480 full (heavy) = @prboom cd /root/doom/wads && /root/doom/prboom -width 800 -height 480 -fullscreen
      320x240 window = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 240 -window
      320x200 window = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 200 -window
      640x480 window (heavy) = @prboom cd /root/doom/wads && /root/doom/prboom -width 640 -height 480 -window
      800x480 window (heavy) = @prboom cd /root/doom/wads && /root/doom/prboom -width 800 -height 480 -window
      320x240 full, no sound = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 240 -fullscreen -nosound
      Timedemo 320x200 full = @prboom cd /root/doom/wads && /root/doom/prboom -width 320 -height 200 -fullscreen -timedemo demo1
    Chocolate Doom (SDL2)
      # chocolate-doom 3.1.1: -width/-height (or -geometry) IMPLY a window;
      # the fullscreen size is config-only (fullscreen_width/height), so the
      # one fullscreen line keeps its existing -extraconfig profile (320x240,
      # snd_samplerate 48000). No rate switch: the rate is config-only too.
      320x240 full, 48 kHz (sound) = @chocolate-doom cd /root/doom && ./chocolate-doom -fullscreen -extraconfig /etc/lvdesk/chocolate-fullscreen.cfg
      320x200 window, no sound = @chocolate-doom cd /root/doom && ./chocolate-doom -window -width 320 -height 200 -1 -nosound -nomusic
      320x240 window = @chocolate-doom cd /root/doom && ./chocolate-doom -width 320 -height 240
      640x480 window (heavy) = @chocolate-doom cd /root/doom && ./chocolate-doom -width 640 -height 480
      800x480 window (heavy) = @chocolate-doom cd /root/doom && ./chocolate-doom -width 800 -height 480
  OpenTyrian
    # Its only switches are --no-sound/--no-joystick/--no-xmas/--data/--net;
    # resolution, fullscreen and scaler are in its own Setup menu.
    Play (sound) = @opentyrian cd /root/oty/usr/share/opentyrian/data && HOME=/root /root/oty/usr/bin/opentyrian --no-joystick
    Play (no sound) = @opentyrian cd /root/oty/usr/share/opentyrian/data && HOME=/root /root/oty/usr/bin/opentyrian --no-sound --no-joystick
  Quake
    # sdlquake 1.0.9 - id's own WinQuake source in Sam Lantinga's SDL 1.2
    # port (rootfs/build-sdlquake.sh), the Quake since 2026-09-25. It asks for
    # 11,025 Hz itself (snd_dma.c desired_speed) - the rate Quake's sounds are
    # recorded at, so nothing is forced - and its fixed 8 MB heap fits where
    # TyrQuake 0.71's 48 kHz sound cache needed 20 MB and swap. Mouse through
    # SDL 1.2 (warp-to-centre, xrel), keys as prboom. Its default is 640x400,
    # so -winsize picks the size (its own option), -fullscreen the mode; it
    # has NO rate switch (desired_speed is a constant). The map-start crash of
    # 09-21 is fixed by -fno-merge-constants in the build (see the script).
    sdlquake (11 kHz fixed)
      320x240 full = @sdlquake cd /root/quake && ./sdlquake -basedir /root/quake -winsize 320 240 -fullscreen
      640x480 full (heavy) = @sdlquake cd /root/quake && ./sdlquake -basedir /root/quake -winsize 640 480 -fullscreen
      800x480 full (heavy) = @sdlquake cd /root/quake && ./sdlquake -basedir /root/quake -winsize 800 480 -fullscreen
      320x240 window = @sdlquake cd /root/quake && ./sdlquake -basedir /root/quake -winsize 320 240
      640x480 window (heavy) = @sdlquake cd /root/quake && ./sdlquake -basedir /root/quake -winsize 640 480
      800x480 window (heavy) = @sdlquake cd /root/quake && ./sdlquake -basedir /root/quake -winsize 800 480
      Timedemo demo1 = @sdlquake cd /root/quake && ./sdlquake -basedir /root/quake -winsize 320 240 -fullscreen +timedemo demo1
    TyrQuake 0.71 (X11 software)
      # Stock TyrQuake 0.71, X11 video, SDL2 sound. Its own default rate is
      # 48 kHz (snd_sdl.c SND_DEFAULT_RATE) and -mem 20 is the known-good
      # line for it; -sndspeed picks another rate. Sounds are resampled to
      # that rate when cached, so a lower rate is lighter, not heavier.
      320x240 full, 48 kHz = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -width 320 -height 240 -fullscreen
      640x480 full, 48 kHz (heavy) = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -width 640 -height 480 -fullscreen
      800x480 full, 48 kHz (heavy) = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -width 800 -height 480 -fullscreen
      320x240 window, 48 kHz = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -width 320 -height 240 -window
      640x480 window, 48 kHz (heavy) = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -width 640 -height 480 -window
      800x480 window, 48 kHz (heavy) = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -width 800 -height 480 -window
      320x240 full, 11 kHz = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -sndspeed 11025 -width 320 -height 240 -fullscreen
      320x240 full, 22 kHz = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -sndspeed 22050 -width 320 -height 240 -fullscreen
      320x240 full, 44 kHz = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -sndspeed 44100 -width 320 -height 240 -fullscreen
      Timedemo demo1, 48 kHz = @tyr-quake-x11 cd /root/quake && HOME=/root/quake ./tyr-quake-x11 -basedir /root/quake -mem 20 -width 320 -height 240 -fullscreen +timedemo demo1
    GLQuake (QuakeSpasm, SDL 1.2 GL)
      # Stock QuakeSpasm 0.96.3 (rootfs/build-quakespasm.sh) through SDL 1.2
      # GLX and our libGL, from SD like the other Quakes. Its own switches
      # only: -mixspeed is its OUTPUT rate (default 44100; -sndspeed, the sfx
      # cache rate, already defaults to 11025, Quake's recorded rate), so
      # -mixspeed 11025 runs the mixer and ALSA at 11 kHz with no lowpass -
      # nothing forced by the platform; 22/44/48 kHz cost mixer CPU, not
      # memory. -zone 384 is its own old 32-bit zone size (the 4 MB
      # default is memset at start and holds only strings here);
      # -heapsize 12288 is the smallest hunk that plays demo1 without the
      # Cache thrashing (10.5 MB loads but reloads models and skins every
      # few frames; 10 MB and 8 MB fail at map load). The shareware pak
      # ignores "+commands" (QuakeSpasm stuffs the command line only for
      # the registered game), so the timedemo runs from /root/quake/td,
      # whose id1/autoexec.cfg says "timedemo demo1" (scripts/board/
      # glquake-setup.sh); the result stays on the console at the end and
      # -condebug also writes it to /root/quake/td/qconsole.log. 800x480
      # fullscreen is panel size, where the desktop's GL render scale
      # applies; 640x480 and the windows render natively. Numbers:
      # artifacts/gl/glquake/README.md.
      320x240 full, 11 kHz = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 11025 -width 320 -height 240 -fullscreen
      640x480 full, 11 kHz (heavy) = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 11025 -width 640 -height 480 -fullscreen
      800x480 full (panel), 11 kHz = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 11025 -width 800 -height 480 -fullscreen
      320x240 window, 11 kHz = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 11025 -width 320 -height 240 -window
      640x480 window, 11 kHz (heavy) = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 11025 -width 640 -height 480 -window
      800x480 window, 11 kHz (heavy) = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 11025 -width 800 -height 480 -window
      320x240 full, 22 kHz = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 22050 -width 320 -height 240 -fullscreen
      320x240 full, 44 kHz = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 44100 -width 320 -height 240 -fullscreen
      320x240 full, 48 kHz = @quakespasm cd /root/quake && ./quakespasm -basedir /root/quake -heapsize 12288 -zone 384 -mixspeed 48000 -width 320 -height 240 -fullscreen
      Timedemo demo1 (full, 11 kHz) = @quakespasm cd /root/quake/td && /root/quake/quakespasm -basedir /root/quake/td -condebug -mixspeed 11025 -heapsize 12288 -zone 384 -width 320 -height 240 -fullscreen
    GLQuake (TyrQuake 0.71, X11 GLX)
      # Stock TyrQuake 0.71 GL (rootfs/build-tyrglquake-x11.sh), X11 video
      # through xlite and GLX through our libGL, SDL2 sound only; from SD in
      # /root/tyrgl with its own basedir and HOME (config and qconsole.log in
      # /root/tyrgl/.tyrquake/id1, apart from QuakeSpasm's). Its own switches
      # only: -sndspeed 11025 (Quake's recorded rate; its default is 48 kHz),
      # -heapsize 14336 (the smallest that does not reload models from the
      # pak every few frames - 13312 did), 320x240. -sndspeed is also the
      # rate the sounds are CACHED at in that heap, so 44/48 kHz hold about
      # 4x the sound data and may thrash it (heavy). TyrQuake stuffs
      # "+commands" itself, so the timedemo needs no autoexec. Its gamma
      # (Options > Brightness) is a VidMode gamma ramp, fullscreen only.
      # Numbers: artifacts/gl/tyrquake/README.md.
      320x240 full, 11 kHz = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 11025 -width 320 -height 240 -fullscreen
      640x480 full, 11 kHz (heavy) = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 11025 -width 640 -height 480 -fullscreen
      800x480 full (panel), 11 kHz = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 11025 -width 800 -height 480 -fullscreen
      320x240 window, 11 kHz = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 11025 -width 320 -height 240 -window
      640x480 window, 11 kHz (heavy) = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 11025 -width 640 -height 480 -window
      800x480 window, 11 kHz (heavy) = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 11025 -width 800 -height 480 -window
      320x240 full, 22 kHz = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 22050 -width 320 -height 240 -fullscreen
      320x240 full, 44 kHz (heavy) = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 44100 -width 320 -height 240 -fullscreen
      320x240 full, 48 kHz (heavy) = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -sndspeed 48000 -width 320 -height 240 -fullscreen
      Timedemo demo1 (full, 11 kHz) = @tyr-glquake cd /root/tyrgl && HOME=/root/tyrgl ./tyr-glquake -basedir /root/tyrgl -heapsize 14336 -condebug -sndspeed 11025 -width 320 -height 240 -fullscreen +timedemo demo1
  GL demos
    # Stock mesa-demos 9.0.0, freeglut and SDL's testgl through our libGL
    # (docs/gl-plan-2026-09-25.md), kept like the other apps: binaries in
    # /root/gl2/bin, GLU and freeglut in /root/gl2/lib, data where the demos
    # were built to look (/usr/share/mesa-demos). Arrow keys; Esc quits.
    # glxgears: -geometry WxH for a window (default 300x300); -fullscreen
    # is always the panel size (it ignores -geometry), render-scaled.
    # testgl: fixed 640x480, -fullscreen its only mode switch. No demo here
    # has sound.
    Gears (glxgears)
      Window 300x300 (default) = @glxgears cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/glxgears
      Fullscreen (panel) = @glxgears cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/glxgears -fullscreen
      320x240 window = @glxgears cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/glxgears -geometry 320x240
      640x480 window (heavy) = @glxgears cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/glxgears -geometry 640x480
      800x480 window (heavy) = @glxgears cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/glxgears -geometry 800x480
    Gears (GLUT) = @gears cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/gears
    Morph 3D = @morph3d cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/morph3d
    Bounce = @bounce cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/bounce
    Gear train = @geartrain cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/geartrain
    Isosurface = @isosurf cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/isosurf
    Terrain (fly) = @terrain cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/terrain
    Tunnel = @tunnel cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/tunnel
    Fire = @fire cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/fire
    Teapot = @teapot cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/teapot
    Textured cylinder = @texcyl cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/texcyl
    Specular texture = @spectex cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/spectex
    Image perspective = @ipers cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/ipers
    Many windows = @manywin cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/manywin
    Hidden line (polygon offset) = @offset cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/offset
    SDL 1.2 GL test (640x480) = @testgl cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/testgl
    SDL 1.2 GL test fullscreen = @testgl cd /root/gl2 && LD_LIBRARY_PATH=/root/gl2/lib ./bin/testgl -fullscreen

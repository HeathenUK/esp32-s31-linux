# Weston configuration for the Korvo-1 panel.
#
# This file is tracked deliberately. It used to exist only as a hand-edit on
# the SD card, so re-imaging silently replaced it with buildroot's default -
# which pins mode=800x480 and leaves the desktop shell's panel and its
# auto-started terminal running. Both quietly changed what was being measured.

[core]
# The plane advertises DRM_FORMAT_RGB565 and nothing else, so the compositor
# has to be told to match. `[output] format=` is silently ignored and
# `--drm-format=` is not a Weston 15 option: gbm-format is the key that works.
gbm-format=rgb565
renderer=pixman
idle-time=0

[shell]
# No panel and no background image. Both are extra surfaces composited on
# every frame, and the panel carries a launcher that starts a second terminal.
panel-position=none
background-color=0xff002244

[output]
name=DPI-1
gbm-format=rgb565
# Deliberately no `mode=`: the driver marks the reduced-size mode preferred
# when esp32s31_lcd.render is set, and pinning a mode here overrides it.

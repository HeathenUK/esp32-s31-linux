# Weston on the Korvo-1 LCD.
#
# gbm-format is the key that matters, and it is easy to get wrong: weston
# silently ignores an unknown key such as "format", falls back to XRGB8888, and
# the DRM plane here advertises only RGB565 - so AddFB2 is refused with EINVAL
# and the only symptom is "failed to create kms fb: Invalid argument" followed
# by a black screen. The name is historical; it applies to the pixman renderer
# too, despite mentioning GBM.
#
# pixman because this SoC has no GPU. PPA is a fixed-function 2D engine that
# glamor cannot use, so there is no GL path to have.

[core]
backend=drm
renderer=pixman
gbm-format=rgb565
idle-time=0

[output]
name=DPI-1
mode=800x480
gbm-format=rgb565

# foot configuration for a single-core board.
#
# workers=0 is the whole point of this file, and it is worth about half the
# machine. foot sizes its render worker pool from the number of logical CPUs
# and the workers busy-wait between jobs. On a single-core system a spinning
# worker starves the very thread that would hand it work, so the terminal
# consumes a core while completely idle - no input, no output, child shell
# asleep.
#
# Measured by throughput displacement (CoreMark; ~960 iter/s is this board with
# nothing running):
#
#     no terminal at all      959.6      cursor 10.85 fps
#     workers=0               954.6      cursor  4.68 fps
#     workers=1 (the default) 463.2
#     workers=2               230.3      cursor  0.00 fps
#
# The cost is almost exactly linear in worker count, and with workers=0 the
# remaining thread sits in state S rather than R.
#
# This is a general hazard on this board rather than a foot bug: any client
# that sizes a thread pool by CPU count and spins between jobs will do the same
# thing. Check for an equivalent knob before shipping any new client.
#
# Diagnosis note: foot warns at startup that this compositor lacks seven
# protocols (server-side cursors, fractional scaling, xdg-activation,
# xdg-toplevel-icon, primary selection, text input, decoration manager). Those
# are unrelated to this and cost nothing measurable - do not chase them.

[main]
workers=0

[cursor]
# No blinking cursor: it would wake the compositor and repaint on a timer for
# no benefit on a 42 Hz panel.
blink=no

# Emergency reserve for a 14 MB machine.
#
# This was 256 kB, on the reasoning that a small appliance wants a small reserve.
# Measurement says the opposite: at 256 kB a streaming read allocates page-cache
# pages faster than kswapd frees them, so reclaim happens synchronously in the
# allocation path. A profile of a 48 MB read is dominated by
# get_page_from_freelist, shrink_node, shrink_slab and shrink_folio_list - the SD
# driver itself barely appears in it.
#
# Giving kswapd room to work in the background instead, measured on a 32 MB
# sequential read: 5.11 -> 6.21 MB/s, with CoreMark under that load rising from
# 313 to 401 iterations/sec against 845 idle.
#
# This does not make bulk I/O free. O_DIRECT still reaches 13.2 MB/s at half the
# CPU because it allocates no page cache at all; this only makes ordinary cached
# I/O cost less.
vm.min_free_kbytes = 1024

# Swap lives on a slow card, so prefer reclaiming page cache over swapping.
# It is a safety valve for memory peaks, not a place to run from.
vm.swappiness = 20

# Emergency reserve for a 14 MB machine.
#
# This was 256 kB, on the reasoning that a small appliance wants a small reserve.
# Measurement says the opposite: at 256 kB a streaming read allocates page-cache
# pages faster than kswapd frees them, so reclaim happens synchronously in the
# allocation path. A profile of a 48 MB read is dominated by
# get_page_from_freelist, shrink_node, shrink_slab and shrink_folio_list - the SD
# driver itself barely appears in it.
#
# Giving kswapd room to work in the background instead, measured on a 32 MB
# sequential read: 5.11 -> 6.21 MB/s, with CoreMark under that load rising from
# 313 to 401 iterations/sec against 845 idle.
#
# This does not make bulk I/O free. O_DIRECT still reaches 13.2 MB/s at half the
# CPU because it allocates no page cache at all; this only makes ordinary cached
# I/O cost less.
vm.min_free_kbytes = 1024

# Swappiness is deliberately high, which looks wrong for a board with slow swap
# and is not. It balances reclaiming anonymous pages against file-backed ones,
# and on this system the file-backed pages are program text - libc, the
# compositor, its plugins. A low value tells the kernel to evict text instead,
# which is exactly the failure that was measured: 48 seconds to page one shared
# library back in, over and over.
#
# That was re-confirmed directly. Timing the worst of three execs of a
# library-heavy binary while Weston holds the machine under memory pressure:
#
#   swappiness 100, SD swap        4.46 / 4.50 s
#   swappiness  20, SD swap        6.46 / 10.65 s
#   swappiness  20, zram only     26.12 s
#
# swappiness=20 is genuinely faster on CPU throughput - 205.2 CoreMark against
# 202.8 - and that is a trap. CoreMark is anonymous-memory-heavy, so it cannot
# see text being evicted; the cost lands entirely on the interactive path, where
# it doubles the worst case. Do not tune this by throughput alone.
# vm.swappiness = 0, and the reason changed rather than the measurement being
# wrong before.
#
# 100 was correct while the userspace lived on the SD card: evicting a file page
# cost an SD read, so it was no better than evicting anonymous memory, and
# leaning on swap kept more of the working set available.
#
# Moving the libraries and the fonts into XIP flash inverted that. A file page
# evicted now costs a cheap re-read from memory-mapped flash; an anonymous page
# evicted costs an SD swap round-trip. So the kernel should throw away file
# pages and keep the heap.
#
# Measured with the X server, a window manager and a terminal running, injecting
# pointer motion at 60 Hz:
#
#   swappiness=100    56 updates / 12 s   639 X major faults   5900 kB swap
#   swappiness=10    143 updates / 12 s    32 X major faults   3852 kB swap
#   swappiness=0     146 updates / 12 s     1 X major fault    3852 kB swap
#
# The server's resident heap goes from 2700 kB - partly evicted, and faulted
# back in on every use - to a stable 3872 kB. This is what made dragging a
# window lag: the pointer path itself was fine, the heap under it was not.
vm.swappiness = 0
# Swap readahead, left at 0 - measured, not inherited.
#
# 0 was originally chosen for zram, where there is no seek to amortise. Once
# zram was dropped in favour of an SD swap file that reasoning no longer
# applied, and the raw numbers looked like a large win waiting to be had: with
# the page cache bypassed, this card delivers 0.39 MB/s at 4k and 2.80 MB/s at
# 32k, because every request costs a fixed ~10 ms no matter its size.
#
# It is not a win. Against the real workload, two replicates each:
#
#   page-cluster 0 (4k)     201.1 CoreMark   4.92 s worst exec
#   page-cluster 3 (32k)    198.8            6.20 s
#   page-cluster 5 (128k)   203.5            5.42 s
#
# Nothing outside run-to-run noise. Two reasons, and the second matters more:
# clustering only pays if the neighbouring pages are wanted, and swapped-out
# anonymous pages are not laid out the way a sequential read is - so the extra
# bytes are fetched and discarded. More fundamentally, page-cluster governs
# swap-in of anonymous pages, while the stall that prompted this is a binary's
# text being faulted back in, which is file-backed and goes through the
# filesystem readahead path instead (see S02s31-blockdev). The lever does not
# reach the thing it was reached for.
#
# The real target is the ~10 ms fixed cost per request, which caps swap at
# 0.39 MB/s on a path that reaches 12.7 MB/s at 1M requests - a 32x gap that has
# nothing to do with how fast the card is.
vm.page-cluster = 0

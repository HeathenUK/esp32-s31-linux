# Feed for the ESP32-S31. There is no upstream riscv32 binary feed and never
# will be, so this points at one generated from our own Buildroot output by
# scripts/mkfeed.py. Change the host to wherever that feed is served.
src/gz s31 http://192.168.1.226:8099/feed

dest root /

# The architecture string is ours; it matches what mkfeed.py stamps into each
# control file. "all" is accepted at lower priority for anything arch-neutral.
arch esp32s31 10
arch all 1

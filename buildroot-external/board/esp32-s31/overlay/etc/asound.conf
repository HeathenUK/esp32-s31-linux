# Output routing.
#
# The desktop names the current sink in /run/s31-sink - the codec, or the
# loopback that s31-bt streams out over A2DP. The s31route plugin follows
# that file and reopens the device underneath a running application, so an
# unmodified player follows a switch mid-track. Rewriting this file instead
# only moved an application on its NEXT open, because alsa-lib binds a stream
# to a device when it opens it.
pcm.s31route { type s31route }
# Quake's device: the same router, but OFFERING only 11025 Hz. TyrQuake asks
# for 48 kHz yet mixes at whatever it is granted, and resamples every cached
# sound to that rate - at 48 kHz its sound cache is ~4.4x the native data and
# the game pages hard (timedemo: 14.0 fps with sound off vs 10.7 at 48 kHz).
# 11025 is Quake's own native rate and its original default. Launched with
# AUDIODEV=s31route_11k; the default device below is unchanged.
pcm.s31route_11k { type s31route max_rate 11025 }
# 22050: half the 48 kHz mixing cost, and the rate to try if an application's
# own low-rate path turns out to be broken (2026-09-23: Quake at 11025 was
# never verified by ear, and sounded wrong).
pcm.s31route_22k { type s31route max_rate 22050 }

pcm.!default { type plug slave.pcm "s31route" }
ctl.!default { type hw card 0 }

# The codec cannot run at every rate an application asks for (prboom's 22050
# Hz is not one of them), so its plug: layer needs a rate converter. Left
# unconfigured, alsa-lib first probes for a "speexrate" module that is not on
# this target and only then settles on the builtin. In prboom's process the
# second codec open of a run (a switch back from Bluetooth mid-game) then
# failed inside snd_pcm_rate_open with "No matching format in rate plugin"
# and -ENOENT, and the stream stayed on Bluetooth; every probe outside prboom
# (linked, dlopen'd like SDL, chdir'd, SDL's exact ring) passed. Naming the
# converter takes the direct path and the switch works, both ways, repeatedly.
# It is the truth anyway - linear is the only converter here.
#
# This file lives on the microSD (/etc is the ext4 root, not an XIP image), so
# a change here reaches a board only via the imager or a deploy of the file.
defaults.pcm.rate_converter "linear"

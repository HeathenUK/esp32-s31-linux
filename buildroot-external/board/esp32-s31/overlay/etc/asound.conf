# Default output. The desktop's volume popover rewrites this file to switch
# between the codec (hw:0,0) and the ALSA loopback (hw:1,0), which s31-bt
# streams out over A2DP. Applications pick a change up on their next open.
pcm.!default { type plug slave.pcm "hw:0,0" }
ctl.!default { type hw card 0 }

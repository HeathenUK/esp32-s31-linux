# Xorg on the ESP32-S31 LCD, via the builtin modesetting driver.
#
# The point of this configuration is what it does NOT do. modesetting defaults
# to glamor, which needs GL; this SoC has no GPU, no mesa and no EGL, so glamor
# must be off and the shadow framebuffer on - modesetting then renders with
# software fb into a dumb buffer and page-flips it, which is the path Weston
# used successfully on this same DRM driver.
#
# Everything here is explicit rather than autodetected because autodetection on
# a board with one connector and no PCI bus tends to produce a confusing
# "no screens found" rather than a useful error.

Section "ServerFlags"
	# There is no second seat, no VT switching and nothing to blank for.
	Option	"AutoAddGPU"		"false"
	Option	"DontVTSwitch"		"true"
	Option	"BlankTime"		"0"
	Option	"StandbyTime"		"0"
	Option	"SuspendTime"		"0"
	Option	"OffTime"		"0"
EndSection

Section "Device"
	Identifier	"esp32s31"
	Driver		"modesetting"
	Option		"kmsdev"	"/dev/dri/card0"
	# No GPU: glamor would fail to initialise and take the server with it.
	Option		"AccelMethod"	"none"
	# ShadowFB must stay ON. Turning it off is not a speed trade, it is
	# incorrect on this board: X then draws straight into the scanout buffer
	# and never calls DirtyFB, and because dma_alloc_coherent returns CACHED
	# memory here those writes sit in the D-cache with nothing to flush them.
	# Observed as the driver's update and flush counters frozen at 732 through
	# an entire pointer-motion run.
	Option		"ShadowFB"	"true"
	# The panel is RGB565 and the DRM plane refuses anything else, so asking
	# for 24 here produces a format the plane will not accept.
	Option		"Dri"		"off"
EndSection

Section "Monitor"
	Identifier	"panel"
EndSection

Section "Screen"
	Identifier	"screen0"
	Device		"esp32s31"
	Monitor		"panel"
	DefaultDepth	16
	SubSection "Display"
		Depth	16
		# No Modes line: take the driver's reduced 640x384 mode.
		#
		# This reverses an earlier decision to force the panel's native
		# 800x480, and both directions were measured.
		#
		# Native was chosen because the reduced mode made
		# esp32s31_lcd_scaling() true, putting a PPA pass on every commit
		# at 5-12 ms. That pass now costs ~1 ms (the PPA was sleeping for
		# its completion, not working), and the cursor that the native mode
		# was also helping is composited in the driver now. So the reason
		# for 800x480 is gone, and what remains is that it costs memory -
		# which is the binding constraint on this board.
		#
		# 800x480 needs a 768,000-byte shadow and a 768,000-byte dumb
		# buffer; 640x384 needs 491,520 of each, and X draws 36% fewer
		# pixels. Full desktop, 30 s settle, fresh boot per arm:
		#
		#                    800x480        640x384
		#   st            rss 216/sw 588  rss 796/sw 0
		#   xcalc         rss   8/sw 416  rss 408/sw 0
		#   jwm           rss 124/sw 192  rss 300/sw 16
		#   MemAvailable         964 kB       1196 kB
		#   repaint max         68.3 ms       48.2 ms
		#   repaint mean        25.8 ms       25.1 ms
		#
		# The clients stop being paged out altogether. That is what "clicks
		# and hovers take a long time to register" was: xcalc sat at 8 kB
		# resident, so a click had to fault the whole client back first.
		# Repaint cost does not move, and the worst case improves.
		#
		# The cost is real: a 640x384 desktop centred in the panel with
		# black borders. The panel's geometry leaves no middle ground - the
		# driver needs the scale to be a whole number of 1/16ths on both
		# axes, which allows 800x480, 640x384 and 400x240 and nothing
		# between. Set the driver's upscale=1 to fill the panel instead of
		# centring, at the cost of a visibly soft 1.25x resample.
	EndSubSection
EndSection

Section "ServerLayout"
	Identifier	"layout"
	Screen	0	"screen0"
EndSection

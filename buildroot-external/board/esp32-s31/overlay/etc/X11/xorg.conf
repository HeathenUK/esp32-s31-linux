# Xorg on the ESP32-S31 LCD, via the builtin modesetting driver.
#
# The point of this configuration is what it does NOT do. modesetting defaults
# to glamor, which needs GL; this SoC has no GPU, no mesa and no EGL, so glamor
# must be off and the shadow framebuffer on - modesetting then renders with
# software fb into a dumb buffer and page-flips it, which is the path Weston
# used successfully on this same DRM driver.
#
# Everything here is explicit rather than autodetected because autodetection on
# a board with one connector and no PCI bus tends to produce a confusing
# "no screens found" rather than a useful error.

Section "ServerFlags"
	# There is no second seat, no VT switching and nothing to blank for.
	Option	"AutoAddGPU"		"false"
	Option	"DontVTSwitch"		"true"
	Option	"BlankTime"		"0"
	Option	"StandbyTime"		"0"
	Option	"SuspendTime"		"0"
	Option	"OffTime"		"0"
EndSection

Section "Device"
	Identifier	"esp32s31"
	Driver		"modesetting"
	Option		"kmsdev"	"/dev/dri/card0"
	# No GPU: glamor would fail to initialise and take the server with it.
	Option		"AccelMethod"	"none"
	Option		"ShadowFB"	"true"
	# The panel is RGB565 and the DRM plane refuses anything else, so asking
	# for 24 here produces a format the plane will not accept.
	Option		"Dri"		"off"
EndSection

Section "Monitor"
	Identifier	"panel"
EndSection

Section "Screen"
	Identifier	"screen0"
	Device		"esp32s31"
	Monitor		"panel"
	DefaultDepth	16
	SubSection "Display"
		Depth	16
	EndSubSection
EndSection

Section "ServerLayout"
	Identifier	"layout"
	Screen	0	"screen0"
EndSection

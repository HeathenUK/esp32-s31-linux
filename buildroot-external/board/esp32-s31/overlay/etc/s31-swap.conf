# Swap configuration, kept separate so alternatives can be measured without
# rebuilding the image. Change, reboot, re-run s31-swap-bench.
#
#   ZRAM_MB     size of the compressed RAM swap device; 0 disables it
#   SD_SWAP     1 to enable the swap file on the microSD
#   SWAPPINESS  overrides vm.swappiness for a measurement run; unset = leave
#               whatever 99-s31-memory.conf set
#
# Swap is not optional. Without any swap Weston never reaches output-enable at
# all - measured, not assumed.
#
# zram is OFF. This has now been measured twice, in opposite directions, and
# the reason it flipped is worth keeping.
#
# It was turned on to kill a repaint tail: with four clients open a single
# full-screen repaint could exceed a second while the card serviced swap-ins
# at ~10 ms each, and zram took the worst case from 1174.9 ms to 65.5 ms.
#
# That tail no longer exists. The driver-composited cursor and the native mode
# removed the work that was causing it - the same worst case now measures
# 44.5 ms with no zram at all. What remains is zram's cost, and on this machine
# it is not small: the pool grew to 2.8-3.2 MB of RAM, more than MemAvailable,
# to hold ~9 MB of compressed pages.
#
# Full desktop (jwm, st, xcalc), 30 s settle, fresh boot per arm:
#
#                        zram 24M    no zram
#   MemAvailable           696 kB    1384 kB
#   Xorg resident         1216 kB    1904 kB
#   xcalc resident          16 kB     128 kB
#   st resident             92 kB     244 kB
#   repaint median        19.5 ms    25.1 ms
#   repaint max           60.4 ms    44.5 ms
#   repaint mean          26.1 ms    26.1 ms
#   launch a process       430 ms     360 ms
#   connect a client       270 ms     240 ms
#
# zram wins the median and nothing else. What it costs is residency: with it,
# xcalc sits at 16 kB resident, so a click has to fault the whole client back
# before it can respond - which is exactly what "clicks take forever to
# register" is. Trading 3 MB of RAM for cheaper faults loses to simply having
# the pages.
#
# This also restores the original conclusion here, which was right for the
# right reason: this machine is memory-poor, not CPU-poor.
#
# The kernel keeps CONFIG_ZRAM, so ZRAM_MB can be raised to re-measure.
#
# RE-MEASURING, 2026-09-12. The numbers above are not wrong, they are about a
# different machine: Xorg with jwm, st and xcalc, four clients whose residency
# was the thing being traded away, and a 24 MB device whose pool grew to
# 2.8-3.2 MB. None of that describes what runs now.
#
# What runs now is lvdesk plus ONE fullscreen client, and the complaint is
# frame dips rather than click latency. The relevant fact is that the client
# takes ~450 major faults per timedemo and pulls over 20 MB off the card, and
# that swap currently lives ON THE CARD - 64 MB of swapfile, so a page going
# out costs an SD write and coming back costs a 2.49 ms request. AnonPages
# under load is 3,552 kB, most of it prboom's precache heap, which is exactly
# the kind of page zram holds well.
#
# Sized at 4 MB, not 24. That is uncompressed capacity; at lzo-rle's typical
# 3x on this kind of data the pool should cost well under 2 MB of RAM, against
# the 2.8-3.2 MB that sank it last time. Enabled ahead of the SD file (S03
# before S04), so zram is primary and the card is overflow.
#
# The residency objection above still applies and is the thing to watch: if
# the fullscreen client's RSS collapses and the dips get worse rather than
# better, that is the same failure in new clothes and this goes back to 0.
#
# AND IT DID, WITHIN ONE RUN. 2026-09-12, 4 MB device, correctly prioritised
# ahead of the card, prboom fullscreen with sound:
#
#     zram used        3,484 kB of 4,092   (nearly full)
#     SD swapfile      1,808 kB            (overflowed to the card ANYWAY)
#     MemAvailable       764 kB
#     CmaFree            524 kB
#
# The desktop stopped repainting. lvdesk was alive the whole time - alive.py
# echoed its nonce, ps showed every process running - but it had been swapped
# out and could not get back in, which from the outside is indistinguishable
# from a dead board. It was reported as one.
#
# So the mechanism is the same one that sank the 24 MB attempt, just faster:
# the pool's compressed pages are RAM, taken from a machine with under 1 MB
# spare, which forces more swapping, which grows the pool. At 4 MB it does not
# even avoid the card - it filled and spilled 1.8 MB there regardless.
#
# This is now measured THREE times in two eras and the answer has not changed:
# this machine is memory-poor, not CPU-poor, and a compressed copy of RAM in
# RAM is not a saving here. Do not re-enable it without first freeing real
# memory - if MemAvailable under load is ever a few MB rather than a few
# hundred kB, the trade is worth revisiting and not before.
#
# SALVAGE ATTEMPT, same day. The failure above had a cause I had not
# controlled: disksize was the ONLY bound. zram's second knob, mem_limit, is a
# hard cap on the RAM the pool may consume, and past it zram refuses writes so
# the kernel falls through to the card. That is the "cheap layer in front"
# behaviour the idea rests on, and without it the pool is unbounded.
#
#   ZRAM_MEM_LIMIT_KB  hard cap on RAM the pool may hold; 0 = no cap (the
#                      configuration that failed)
#
# Generous capacity, small footprint: 8 MB of uncompressed capacity that may
# never cost more than 512 kB of RAM. If the hot swapped set fits in 512 kB
# compressed, it is served from PSRAM; everything else goes to the card as
# before, at no RAM cost.
#
# What still has to be checked before believing any of this: the COMPRESSION
# RATIO, from /sys/block/zram0/mm_stat (orig_data_size against
# compr_data_size). It was never recorded. If game data only compresses 1.5x,
# 512 kB of RAM buys 768 kB of swap and this cannot pay at any size.
#
# RESULT of the capped attempt, prboom fullscreen timedemo with sound, warm,
# CMA 4 MB, readahead 64:
#
#                    fps   majflt   min MemAvailable   zram used
#   zram off        23.2      144         408 kB          n/a
#   zram capped     23.1      210         472 kB            0
#
# zram WAS NEVER USED. The pool stayed at 4,096 bytes and nothing swapped into
# it, so this shows no benefit and the fps difference is noise. What it does
# show is that mem_limit removes the failure: the uncapped run filled 3,484 kB,
# drove MemAvailable to 764 kB and stopped the desktop repainting, while the
# capped one stayed inert under the same workload.
#
# SHIPPING IT ON in this form. Bounded cost when used, no cost when not, and
# the card is strictly worse when pressure does arrive. That is a safety valve,
# not a measured win, and it must not be described as one.
#
# To show a benefit, something has to actually swap: several clients at once,
# or a client with a working set larger than this one's. Until then the honest
# statement is "harmless and unexercised".
# OFF AGAIN, 2026-09-12, and this is the fourth measurement in three eras.
#
# The capped configuration was described here as "harmless and unexercised"
# on the strength of one run in which nothing swapped. On a longer, real
# session it did exercise, and it was not harmless:
#
#                        zram on     zram off
#   MemAvailable           476 kB     2,932 kB
#   CmaFree                132 kB     1,484 kB
#   zram pool         512 kB (at its cap, full)
#   swapped into zram    2,984 kB
#
# Six times the headroom with it off. The cap did its job - the pool stopped
# at 512 kB instead of running away as the uncapped 4 MB device did - but the
# cap only bounds the POOL. It does nothing about the 2,984 kB of pages the
# device encouraged the kernel to swap out, which then have to be faulted back
# through a 512 kB window.
#
# The desktop and the game were visibly slow and lagging in this state. Turned
# off at runtime and the board recovered immediately.
#
# Three eras, three workloads, one answer: this machine is memory-poor, not
# CPU-poor, and a compressed copy of RAM in RAM does not pay here. The next
# person to try should first establish that MemAvailable under load is a few
# MB rather than a few hundred kB. It is not.
ZRAM_MB=0
ZRAM_MEM_LIMIT_KB=0
SD_SWAP=1

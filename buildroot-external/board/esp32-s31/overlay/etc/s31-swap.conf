# Swap configuration, kept separate so alternatives can be measured without
# rebuilding the image. Change, reboot, re-run s31-swap-bench.
#
#   ZRAM_MB     size of the compressed RAM swap device; 0 disables it
#   SD_SWAP     1 to enable the swap file on the microSD
#   SWAPPINESS  overrides vm.swappiness for a measurement run; unset = leave
#               whatever 99-s31-memory.conf set
#
# Swap is not optional. Without any swap Weston never reaches output-enable at
# all - measured, not assumed.
#
# zram is OFF. This has now been measured twice, in opposite directions, and
# the reason it flipped is worth keeping.
#
# It was turned on to kill a repaint tail: with four clients open a single
# full-screen repaint could exceed a second while the card serviced swap-ins
# at ~10 ms each, and zram took the worst case from 1174.9 ms to 65.5 ms.
#
# That tail no longer exists. The driver-composited cursor and the native mode
# removed the work that was causing it - the same worst case now measures
# 44.5 ms with no zram at all. What remains is zram's cost, and on this machine
# it is not small: the pool grew to 2.8-3.2 MB of RAM, more than MemAvailable,
# to hold ~9 MB of compressed pages.
#
# Full desktop (jwm, st, xcalc), 30 s settle, fresh boot per arm:
#
#                        zram 24M    no zram
#   MemAvailable           696 kB    1384 kB
#   Xorg resident         1216 kB    1904 kB
#   xcalc resident          16 kB     128 kB
#   st resident             92 kB     244 kB
#   repaint median        19.5 ms    25.1 ms
#   repaint max           60.4 ms    44.5 ms
#   repaint mean          26.1 ms    26.1 ms
#   launch a process       430 ms     360 ms
#   connect a client       270 ms     240 ms
#
# zram wins the median and nothing else. What it costs is residency: with it,
# xcalc sits at 16 kB resident, so a click has to fault the whole client back
# before it can respond - which is exactly what "clicks take forever to
# register" is. Trading 3 MB of RAM for cheaper faults loses to simply having
# the pages.
#
# This also restores the original conclusion here, which was right for the
# right reason: this machine is memory-poor, not CPU-poor.
#
# The kernel keeps CONFIG_ZRAM, so ZRAM_MB can be raised to re-measure.
ZRAM_MB=0
SD_SWAP=1

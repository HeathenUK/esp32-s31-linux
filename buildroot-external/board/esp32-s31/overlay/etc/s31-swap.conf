# Swap configuration, kept separate so alternatives can be measured without
# rebuilding the image. Change, reboot, re-run s31-swap-bench.
#
#   ZRAM_MB     size of the compressed RAM swap device; 0 disables it
#   SD_SWAP     1 to enable the swap file on the microSD
#   SWAPPINESS  overrides vm.swappiness for a measurement run; unset = leave
#               whatever 99-s31-memory.conf set
#
# Swap is not optional. Without any swap Weston never reaches output-enable at
# all - measured, not assumed.
#
# zram is off, which is the opposite of the obvious answer for a slow-storage
# board, and it was measured rather than reasoned. Over 15+ runs against a
# Weston workload, CoreMark under load and the worst of three execs of a
# library-heavy binary under the same memory pressure:
#
#   SD only, swappiness 100      202.8       4.46 / 4.50 s     <- shipped
#   zram 4M + SD, swappiness 100 195.3       5.89 / 6.24 s
#   SD only, swappiness 20       205.2       6.46 / 10.65 s
#   zram 24M only, swappiness 20 176.9      26.12 s
#
# zram loses because this machine is memory-poor, not CPU-poor. Its zsmalloc
# pool costs ~1 MB of MemAvailable (4404 -> 3504 kB at boot) to save compression
# work that was never expensive: the shipped workload writes 4.8 MB to zram over
# a 5 minute run, about 16 kB/s, which is a rounding error of one core. Paying a
# megabyte of a 13.4 MB budget for that is a bad trade here and would not be on
# a board with more RAM.
#
# Note the two right-hand columns disagree about swappiness=20, and the latency
# one is right: see 99-s31-memory.conf.
ZRAM_MB=0
SD_SWAP=1

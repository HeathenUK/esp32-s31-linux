# Swap configuration, kept separate so alternatives can be measured without
# rebuilding the image. Change, reboot, re-run s31-swap-bench.
#
#   ZRAM_MB     size of the compressed RAM swap device; 0 disables it
#   SD_SWAP     1 to enable the swap file on the microSD
#   SWAPPINESS  overrides vm.swappiness for a measurement run; unset = leave
#               whatever 99-s31-memory.conf set
#
# Swap is not optional. Without any swap Weston never reaches output-enable at
# all - measured, not assumed.
#
# zram is ON, at 24 MB. This reverses an earlier decision, and the earlier
# decision was not wrong - it was measured against a workload that no longer
# exists.
#
# The old table compared CoreMark-under-load and exec latency while Weston was
# the compositor, and zram lost: it cost ~1 MB of MemAvailable to compress a
# workload that only wrote ~16 kB/s. That reasoning still holds for throughput.
#
# The X11 desktop fails differently. Its complaint is not throughput, it is a
# freeze: with jwm, st, xcalc and xfiles open, ~7-9 MB is in swap, and a single
# full-screen repaint occasionally takes over a second while the card services
# swap-ins at ~10 ms each. Measured with `xfill 30` (full root repaints through
# one long-lived connection, so no process-startup cost is included), four
# clients open, fresh boot per arm, identical protocol:
#
#                 median      max       mean     one exec
#   SD only       32.1 ms   1174.9 ms   73.6 ms   330 ms
#   zram  8M      31.3 ms    498.1 ms   57.0 ms   490 ms
#   zram 24M      31.8 ms     65.5 ms   29.5 ms   850 ms
#
# The medians are identical - zram does not make the common case faster. It
# removes the tail: 1175 ms -> 65 ms, an 18x cut in the worst stall, and 2.5x
# off the mean. That tail is what "it ground to a halt" actually is.
#
# The cost is real and is not hidden: launching a process goes 330 -> 850 ms,
# because the zsmalloc pool takes ~780 kB of MemAvailable and the page cache
# loses it, so more of each binary is re-read from the card. A once-per-launch
# cost was judged the better thing to spend, against a stall that recurs
# throughout continuous interaction.
#
# Note this needed CONFIG_ZRAM in the kernel, which was absent: S03s31-zram
# had been shipping its `[ -b /dev/zram0 ] || exit 0` guard for months and
# silently doing nothing on every boot.
ZRAM_MB=24
SD_SWAP=1
